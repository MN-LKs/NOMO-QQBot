name               = "nomo-qqbot"
main               = "src/index.js"
compatibility_date = "2026-09-01"

[observability]
enabled = true

# 部署构建前自动清理 README / docs 等描述文件,保持构建上下文干净。
# (Workers 只打包被 import 的模块,描述文件本来不会进部署产物;这一步是防止以后
#  启用静态资源目录时把文档一起传上去。)
# 脚本只在 Cloudflare 构建环境(WORKERS_CI)里真的删除,本地 wrangler dev/deploy 会跳过。
# 想手动清理:npm run strip:docs
[build]
command = "node tools/strip-docs.js"

# 管理员账号请在 Cloudflare 后台设置(Settings → Variables and Secrets),
# 或者用 `npx wrangler secret put ADMIN_USER` / `ADMIN_PASS` 写入。
#
# 注意:不要把空值写进 [vars] —— 每次部署都会用文件里的值覆盖后台设置,
# 空的 ADMIN_USER / ADMIN_PASS 会让面板直接锁死(显示「登录功能已关闭」)。
# 确实想用文件管理的话,取消下面两行注释并填值(提交前记得清掉真实密码):
# [vars]
# ADMIN_USER = ""
# ADMIN_PASS = ""

# ---------------------------------------------------------------------------
# 需要两个绑定:D1 数据库(DB)和 KV 命名空间(STORE)。
# 可选第三个绑定:R2 存储桶(R2)。绑了 R2 之后,登录面板会自动把 R2 设为主存储,
# 部署的文件优先存 R2(免费额度 10 GB),KV 退居备用/缓存。
# 还可以在面板「存储」页里接外部的 S3 兼容存储(Filebase、Upstash Blob 等)。
#
# 方式一(推荐):在 Cloudflare 后台 → Workers & Pages → nomo-qqbot → Settings → Bindings
#   添加 D1 database  变量名填 DB
#   添加 KV namespace 变量名填 STORE
#   添加 R2 bucket    变量名填 R2     (可选,但强烈建议)
#
# 方式二:在后台创建好后,把 ID 填到下面几段里再提交(数据库 ID 不是密钥,可以公开)
# ---------------------------------------------------------------------------
# [[d1_databases]]
# binding       = "DB"
# database_name = "nomo-qqbot"
# database_id   = ""

# [[kv_namespaces]]
# binding = "STORE"
# id      = ""

# [[r2_buckets]]
# binding     = "R2"
# bucket_name = "nomo-qqbot"

[[durable_objects.bindings]]
name       = "BOT_CORE"
class_name = "BotCore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BotCore"]

# 每 2 分钟兜一次底:重连 WebSocket、处理积压消息、清理过期项目、清理群消息缓存
[triggers]
crons = ["*/2 * * * *"]
