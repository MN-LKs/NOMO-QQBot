name               = "npapi"
main               = "src/index.js"
compatibility_date = "2026-09-01"

[observability]
enabled = true

[vars]
QQ_APP_ID        = ""
QQ_APP_SECRET    = ""
LLM_BASE_URL     = ""
LLM_API_KEY      = ""
SEARCH_API_URL   = ""
SEARCH_API_KEY   = ""
PUBLIC_BASE_URL  = ""

[[durable_objects.bindings]]
name       = "BOT_CORE"
class_name = "BotCore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BotCore"]

[triggers]
crons = ["*/10 * * * *"]

